services:
  # Backend: Flask Web Service
  - type: web
    name: dukaanai-backend
    runtime: python
    repo: https://github.com/agdesigner12-afk/dukaanai-whatsapp
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_NUMBER
        value: +14155238886
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-latest

  # Frontend: React Static Site
  - type: static_site
    name: dukaandash-dashboard
    repo: https://github.com/agdesigner12-afk/dukaanai-whatsapp
    branch: main
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishPath: build
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          type: web
          name: dukaanai-backend
          property: host